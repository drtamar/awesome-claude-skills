<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Automation - Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d1a; color: #e0e0e0; padding: 40px; max-width: 600px; margin: 0 auto;
    }
    h1 { font-size: 22px; margin-bottom: 24px; color: #6c5ce7; }
    .section { background: #111122; border: 1px solid #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .section h2 { font-size: 15px; margin-bottom: 14px; color: #ccc; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
    .input {
      width: 100%; background: #0a0a15; border: 1px solid #2d2d44; border-radius: 8px;
      padding: 8px 12px; color: #e0e0e0; font-size: 13px; outline: none;
    }
    .input:focus { border-color: #6c5ce7; }
    .checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #aaa; cursor: pointer; margin-bottom: 8px; }
    .btn {
      padding: 10px 20px; background: #6c5ce7; color: #fff; border: none;
      border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500;
    }
    .btn:hover { background: #5a4bd1; }
    .status { margin-top: 12px; font-size: 12px; padding: 8px; border-radius: 6px; display: none; }
    .status.show { display: block; }
    .status.success { background: rgba(0,184,148,0.15); color: #00b894; }
    .status.error { background: rgba(214,48,49,0.15); color: #d63031; }
  </style>
</head>
<body>
  <h1>Claude Automation Settings</h1>

  <div class="section">
    <h2>Proxy Server</h2>
    <div class="form-group">
      <label>Proxy URL</label>
      <input type="url" id="proxy-url" class="input" placeholder="http://127.0.0.1:3456">
    </div>
    <label class="checkbox">
      <input type="checkbox" id="enable-signing"> Enable request signing
    </label>
    <div class="form-group" id="signing-secret-group" style="display:none">
      <label>Signing Secret</label>
      <input type="password" id="signing-secret" class="input" placeholder="Must match SIGNING_SECRET in .env">
    </div>
  </div>

  <div class="section">
    <h2>Automation Defaults</h2>
    <div class="form-group">
      <label>Default page operation timeout (ms)</label>
      <input type="number" id="timeout" class="input" value="30000">
    </div>
    <div class="form-group">
      <label>Max concurrent automations</label>
      <input type="number" id="max-concurrent" class="input" value="5">
    </div>
    <label class="checkbox">
      <input type="checkbox" id="auto-execute" checked> Auto-execute generated automations
    </label>
    <label class="checkbox">
      <input type="checkbox" id="notify-complete" checked> Notify on automation complete
    </label>
  </div>

  <div class="section">
    <h2>Download Settings</h2>
    <label class="checkbox">
      <input type="checkbox" id="enable-downloads" checked> Enable download management
    </label>
    <div class="form-group">
      <label>Default download subfolder</label>
      <input type="text" id="download-dir" class="input" placeholder="claude-browser">
    </div>
  </div>

  <button class="btn" id="btn-save">Save Settings</button>
  <button class="btn" id="btn-test" style="margin-left:8px;background:#1a1a2e;border:1px solid #6c5ce7;color:#6c5ce7">Test Connection</button>
  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
