<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px; min-height: 500px; max-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d1a; color: #e0e0e0;
    }
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 14px 16px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid #6c5ce7;
    }
    .header-icon {
      width: 32px; height: 32px; background: #6c5ce7; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px;
    }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-subtitle { font-size: 11px; color: #888; }
    .header-actions { margin-left: auto; display: flex; gap: 6px; }
    .header-btn {
      background: rgba(108,92,231,0.2); border: 1px solid #6c5ce7; color: #6c5ce7;
      border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    }
    .header-btn:hover { background: #6c5ce7; color: #fff; }

    .status-bar {
      padding: 6px 16px; font-size: 11px; display: flex; align-items: center; gap: 6px;
      background: #111; border-bottom: 1px solid #222;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.connected { background: #00b894; }
    .status-dot.disconnected { background: #d63031; }

    .quick-actions {
      padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      border-bottom: 1px solid #222;
    }
    .quick-action {
      background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 8px;
      padding: 10px; cursor: pointer; text-align: center; transition: all 0.15s;
    }
    .quick-action:hover { border-color: #6c5ce7; background: #1e1e38; }
    .quick-action-icon { font-size: 20px; margin-bottom: 4px; }
    .quick-action-label { font-size: 11px; color: #aaa; }

    .chat-container { display: flex; flex-direction: column; height: 310px; }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 12px 16px; display: flex;
      flex-direction: column; gap: 10px;
    }
    .message {
      padding: 10px 12px; border-radius: 10px; font-size: 12px;
      line-height: 1.5; max-width: 90%; word-wrap: break-word;
    }
    .message.user {
      background: #6c5ce7; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px;
    }
    .message.assistant {
      background: #1a1a2e; border: 1px solid #2d2d44; align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message pre {
      background: #0d0d1a; padding: 6px 8px; border-radius: 4px; margin: 6px 0;
      overflow-x: auto; font-size: 11px;
    }
    .message code { color: #a8e6cf; font-size: 11px; }
    .message .run-btn {
      display: inline-block; margin-top: 6px; padding: 3px 10px;
      background: #6c5ce7; color: #fff; border: none; border-radius: 4px;
      font-size: 11px; cursor: pointer;
    }

    .chat-input-area {
      padding: 10px 16px; border-top: 1px solid #222; display: flex; gap: 8px;
    }
    .chat-input {
      flex: 1; background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 8px;
      padding: 8px 12px; color: #e0e0e0; font-size: 13px; outline: none; resize: none;
      font-family: inherit;
    }
    .chat-input:focus { border-color: #6c5ce7; }
    .chat-input::placeholder { color: #555; }
    .send-btn {
      background: #6c5ce7; border: none; border-radius: 8px; padding: 8px 14px;
      color: #fff; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .send-btn:hover { background: #5a4bd1; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .typing-indicator { display: flex; gap: 4px; padding: 10px 12px; }
    .typing-dot {
      width: 6px; height: 6px; background: #6c5ce7; border-radius: 50%;
      animation: typing-bounce 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">C</div>
    <div>
      <div class="header-title">Claude Automation</div>
      <div class="header-subtitle">AI Browser Control</div>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="btn-dashboard">Dashboard</button>
      <button class="header-btn" id="btn-settings">Settings</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot disconnected" id="status-dot"></div>
    <span id="status-text">Connecting...</span>
  </div>

  <div class="quick-actions">
    <div class="quick-action" data-action="scrape">
      <div class="quick-action-icon">&#128269;</div>
      <div class="quick-action-label">Scrape Page</div>
    </div>
    <div class="quick-action" data-action="screenshot">
      <div class="quick-action-icon">&#128247;</div>
      <div class="quick-action-label">Screenshot</div>
    </div>
    <div class="quick-action" data-action="inspect">
      <div class="quick-action-icon">&#128736;</div>
      <div class="quick-action-label">Inspect DOM</div>
    </div>
    <div class="quick-action" data-action="inject">
      <div class="quick-action-icon">&#128187;</div>
      <div class="quick-action-label">Inject Code</div>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-messages" id="messages">
      <div class="message assistant">
        Hi! I'm Claude. Tell me what you'd like to automate on this page. I can scrape data, fill forms, click buttons, inject code, and much more.
      </div>
    </div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="input" placeholder="Describe what to automate..." rows="1"></textarea>
      <button class="send-btn" id="send-btn">Send</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
